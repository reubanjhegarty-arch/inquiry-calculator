<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate running, cycling, or swimming pace per km or mile."><title>Pace Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/pace-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Pace Calculator</h1><p>Calculate running, cycling, or swimming pace per km or mile.</p><form id="f"><label>Distance (km or miles)</label><input type="number" id="d" step="0.01" required><label>Time (Minutes)</label><input type="number" id="m" required><button type="submit">Calculate Pace</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let pace=+m.value/+d.value,min=Math.floor(pace),sec=Math.round((pace-min)*60);result.innerHTML='Pace: '+min+':'+('0'+sec).slice(-2)+' per unit';result.style.display='block'}</script></body></html>
