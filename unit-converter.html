<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Convert length, weight, temperature."><title>Unit Converter - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/unit-converter.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Unit Converter</h1><p>Convert length, weight, temperature.</p><form id="f"><label>Value</label><input type="number" id="v" required><label>From</label><select id="from"><option value="m">Meters</option><option value="km">Kilometers</option><option value="ft">Feet</option><option value="mi">Miles</option></select><label>To</label><select id="to"><option value="ft">Feet</option><option value="m">Meters</option><option value="km">Kilometers</option><option value="mi">Miles</option></select><button type="submit">Convert</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>const toM={m:1,km:1000,ft:0.3048,mi:1609.34};f.onsubmit=e=>{e.preventDefault();let meters=+v.value*toM[from.value];let res=meters/toM[to.value];result.innerHTML=res.toFixed(4)+' '+to.value;result.style.display='block'}</script></body></html>
