<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Payoff — Inquiry Calculator</title>
    <meta name="description" content="Months to payoff.">
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('inquiry_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Inquiry <span class="logo-badge">PRO</span></a>
            <div class="nav-links">
                <a href="/">All Calculators</a>
                <a href="/chat.html">AI Solver</a>
            </div>
        </div>
    </nav>
    <main class="wrap">
        <h1>Credit Card Payoff</h1>
        <p>Months to payoff.</p>
        <form onsubmit="event.preventDefault(); calculate();">
            <div class="form-group"><label>Balance ($)</label><input type="number" id="b" placeholder="Enter balance ($)" required></div>
            <div class="form-group"><label>Rate (%)</label><input type="number" id="r" placeholder="Enter rate (%)" required></div>
            <div class="form-group"><label>Monthly Payment ($)</label><input type="number" id="p" placeholder="Enter monthly payment ($)" required></div>
            <button type="submit">Calculate</button>
        </form>
        <div id="result" class="result" style="display:none;">
            Result: <strong id="output-val">0</strong>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Inquiry Calculator. &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p>
    </footer>
    <script>
        function calculate() {
            try {
                const v = {};
                document.querySelectorAll('input, select').forEach(el => { v[el.id] = el.value; });
                let result = (function(v) { let b=parseFloat(v.b), r=parseFloat(v.r)/100/12, p=parseFloat(v.p); if(p<=b*r) return 'Payment too low'; return Math.ceil(-Math.log(1-b*r/p)/Math.log(1+r))+' months'; })(v);
                if (result !== undefined && !isNaN(result) && result !== 'NaN' && result !== 'NaN%') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                } else if (typeof result === 'string') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
