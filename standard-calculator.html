<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standard Calculator — Inquiry Calculator</title>
    <meta name="description" content="Free online standard calculator for addition, subtraction, multiplication, and division.">

    <link rel="stylesheet" href="style.css">

    <script>
        const savedTheme = localStorage.getItem('inquiry_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
</head>
<body>

    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Inquiry <span class="logo-badge">PRO</span></a>
            <div class="nav-links">
                <a href="/">All Calculators</a>
                <a href="/chat.html">AI Solver</a>
            </div>
        </div>
    </nav>

    <main class="wrap">
        <h1>Standard Calculator</h1>
        <p>Perform basic arithmetic operations quickly and accurately.</p>

        <form onsubmit="event.preventDefault(); calculate();">
            <div class="form-group">
                <label>First Number</label>
                <input type="number" id="num1" step="any" placeholder="Enter number" required>
            </div>

            <div class="form-group">
                <label>Operation</label>
                <select id="op">
                    <option value="+">Addition (+)</option>
                    <option value="-">Subtraction (-)</option>
                    <option value="*">Multiplication (×)</option>
                    <option value="/">Division (÷)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Second Number</label>
                <input type="number" id="num2" step="any" placeholder="Enter number" required>
            </div>

            <button type="submit">Calculate</button>
        </form>

        <div id="result" class="result" style="display:none;">
            Result: <strong id="output-val">0</strong>
        </div>
    </main>

    <footer>
        <p>&copy; 2025 Inquiry Calculator. &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p>
    </footer>

    <script>
        function calculate() {
            const n1 = parseFloat(document.getElementById('num1').value);
            const n2 = parseFloat(document.getElementById('num2').value);
            const op = document.getElementById('op').value;
            let res = 0;

            if (isNaN(n1) || isNaN(n2)) return;

            if (op === '+') res = n1 + n2;
            else if (op === '-') res = n1 - n2;
            else if (op === '*') res = n1 * n2;
            else if (op === '/') res = n2 !== 0 ? n1 / n2 : 'Cannot divide by zero';

            document.getElementById('output-val').textContent = res;
            document.getElementById('result').style.display = 'block';
        }
    </script>
</body>
</html>
