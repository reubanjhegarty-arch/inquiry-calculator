<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate daily macronutrients (Carbs, Protein, Fat) based on calories."><title>Macros Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/macros-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Macros Calculator</h1><p>Calculate daily macronutrients (Carbs, Protein, Fat) based on calories.</p><form id="f"><label>Daily Calories Target</label><input type="number" id="c" required placeholder="e.g. 2000"><button type="submit">Calculate (50% C / 30% P / 20% F)</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let carbs=(+c.value*0.5)/4,protein=(+c.value*0.3)/4,fat=(+c.value*0.2)/9;result.innerHTML='Protein: '+protein.toFixed(0)+'g<br>Carbs: '+carbs.toFixed(0)+'g<br>Fat: '+fat.toFixed(0)+'g';result.style.display='block'}</script></body></html>
