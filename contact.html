<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Inquiry Calculator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .page-container { max-width: 600px; margin: 100px auto 50px; padding: 2rem; }
        .page-title { font-size: 2.5rem; letter-spacing: -0.05em; margin-bottom: 0.5rem; }
        .page-subtitle { color: var(--text-muted); margin-bottom: 2rem; font-size: 1.125rem; }
        
        .contact-form { display: flex; flex-direction: column; gap: 1.25rem; }
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .form-label { font-size: 0.875rem; font-weight: 500; color: var(--text-muted); }
        .form-control { background: transparent; border: 1px solid var(--border-color); color: var(--text-color); padding: 0.75rem 1rem; border-radius: 6px; font-size: 1rem; font-family: inherit; transition: 0.2s; }
        .form-control:focus { border-color: var(--text-color); outline: none; }
        textarea.form-control { resize: vertical; min-height: 120px; }
        
        .btn-submit { background: var(--text-color); color: var(--bg-color); border: none; padding: 0.875rem; border-radius: 6px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.2s; margin-top: 1rem; }
        .btn-submit:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <!-- Include Global Header -->

    <main class="page-container fade-up">
        <h1 class="page-title">Get in Touch</h1>
        <p class="page-subtitle">Have a feature request, found a bug, or just want to say hi? Send us a message.</p>

        <form class="contact-form" onsubmit="event.preventDefault(); alert('Message sent!');">
            <div class="form-group">
                <label class="form-label" for="name">Name</label>
                <input type="text" id="name" class="form-control" placeholder="John Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" class="form-control" placeholder="john@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="message">Message</label>
                <textarea id="message" class="form-control" placeholder="How can we help?" required></textarea>
            </div>
            <button type="submit" class="btn-submit">Send Message</button>
        </form>
    </main>

    <!-- Include Global Footer -->
</body>
</html>
