<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate GPA from grades and credits."><title>GPA Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/gpa-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>GPA Calculator</h1><p>Calculate GPA from grades and credits.</p><form id="f"><label>Enter grades (A=4,B=3,C=2,D=1,F=0) separated by comma</label><input type="text" id="gr" placeholder="4,3,3,4" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let a=gr.value.split(',').map(x=>+x.trim()).filter(x=>!isNaN(x));let gpa=a.reduce((s,v)=>s+v,0)/a.length;result.innerHTML='GPA: '+gpa.toFixed(2);result.style.display='block'}</script></body></html>
