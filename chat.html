<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Problem Solver | Inquiry Calculator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Chat-specific sleek styling */
        body { margin: 0; overflow: hidden; display: flex; flex-direction: column; height: 100vh; background-color: var(--bg-color); }
        
        .chat-layout { display: flex; flex: 1; overflow: hidden; margin-top: 60px; /* Offset for global nav */ }
        
        /* Sidebar */
        .chat-sidebar { width: 260px; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; background-color: var(--card-bg); }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border-color); }
        .btn-new-chat { width: 100%; display: flex; align-items: center; justify-content: center; gap: 0.5rem; padding: 0.75rem; background: transparent; border: 1px solid var(--border-color); color: var(--text-color); border-radius: 6px; cursor: pointer; transition: 0.2s; font-size: 0.875rem; }
        .btn-new-chat:hover { background: var(--text-color); color: var(--bg-color); }
        .chat-history { flex: 1; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.5rem; }
        .history-item { padding: 0.75rem; border-radius: 6px; font-size: 0.875rem; color: var(--text-muted); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid transparent; transition: 0.2s; }
        .history-item:hover, .history-item.active { background: var(--card-bg-hover); color: var(--text-color); border-color: var(--border-color); }

        /* Main Chat Area */
        .chat-main { flex: 1; display: flex; flex-direction: column; position: relative; }
        .chat-messages { flex: 1; overflow-y: auto; padding: 2rem 1rem; scroll-behavior: smooth; }
        .chat-container { max-width: 800px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
        
        /* Messages */
        .message { display: flex; gap: 1rem; line-height: 1.6; }
        .message.user { flex-direction: row-reverse; }
        
        .avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: bold; flex-shrink: 0; font-size: 0.875rem; }
        .message.ai .avatar { background: var(--text-color); color: var(--bg-color); }
        .message.user .avatar { background: var(--border-color); color: var(--text-color); }
        
        .message-content { max-width: 80%; padding: 0.875rem 1.25rem; border-radius: 6px; font-size: 0.95rem; }
        .message.ai .message-content { background: transparent; padding: 0.25rem 0; color: var(--text-color); }
        .message.user .message-content { background: var(--card-bg-hover); border: 1px solid var(--border-color); color: var(--text-color); }
        
        /* Input Area */
        .chat-input-wrapper { padding: 1.5rem; background: linear-gradient(to top, var(--bg-color) 80%, transparent); position: sticky; bottom: 0; }
        .chat-input-container { max-width: 800px; margin: 0 auto; position: relative; display: flex; align-items: flex-end; background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 6px; transition: border-color 0.2s; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        .chat-input-container:focus-within { border-color: var(--text-muted); }
        
        .chat-input { flex: 1; background: transparent; border: none; color: var(--text-color); padding: 1rem; font-family: inherit; font-size: 1rem; resize: none; max-height: 200px; outline: none; }
        .chat-input::placeholder { color: var(--text-muted); }
        
        .btn-send { background: var(--text-color); color: var(--bg-color); border: none; border-radius: 4px; padding: 0.5rem 1rem; margin: 0.5rem; cursor: pointer; transition: 0.2s; font-weight: 600; font-size: 0.875rem; }
        .btn-send:hover { opacity: 0.8; }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

        /* Sharp Typing Indicator */
        .typing-indicator { display: flex; gap: 4px; align-items: center; padding: 0.5rem 0; }
        .dot { width: 6px; height: 6px; background-color: var(--text-muted); border-radius: 1px; animation: sharpBounce 1.4s infinite ease-in-out both; }
        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }
        
        @keyframes sharpBounce {
            0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .chat-sidebar { display: none; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Standard Global Nav -> include your header code here -->
    <header class="glass-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"></path><path d="M4 10h16"></path><path d="M10 4v16"></path></svg>
                Inquiry Calculator
            </a>
            <!-- Nav buttons (Search, Theme, etc) -->
        </div>
    </header>

    <div class="chat-layout">
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" onclick="startNewChat()">+ New Chat</button>
            </div>
            <div class="chat-history" id="chatHistory">
                <!-- Populated by JS -->
            </div>
        </aside>

        <main class="chat-main">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-container" id="messageContainer">
                    <div class="message ai">
                        <div class="avatar">AI</div>
                        <div class="message-content">Hello. I am the Inquiry Problem Solver. How can I help you today?</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                <div class="chat-input-container">
                    <textarea class="chat-input" id="chatInput" rows="1" placeholder="Message Inquiry AI (Shift+Enter for new line)..."></textarea>
                    <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
                </div>
                <div style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                    AI can make mistakes. Verify important calculations. Guest limit: 3/day.
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const chatInput = document.getElementById('chatInput');
        const messageContainer = document.getElementById('messageContainer');
        const chatMessages = document.getElementById('chatMessages');
        const sendBtn = document.getElementById('sendBtn');

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if(this.value.trim() === '') this.style.height = 'auto';
        });

        // Submit on Enter, New line on Shift+Enter
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Check for pending question from Hero input
        window.addEventListener('DOMContentLoaded', () => {
            const pending = sessionStorage.getItem('pending_question');
            if (pending) {
                chatInput.value = pending;
                sessionStorage.removeItem('pending_question');
                sendMessage();
            }
        });

        function startNewChat() {
            messageContainer.innerHTML = `
                <div class="message ai">
                    <div class="avatar">AI</div>
                    <div class="message-content">New conversation started. What's on your mind?</div>
                </div>`;
            chatInput.focus();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage('user', text);
            chatInput.value = '';
            chatInput.style.height = 'auto';
            chatInput.focus();

            // Append Typing Indicator
            const typingId = 'typing-' + Date.now();
            messageContainer.insertAdjacentHTML('beforeend', `
                <div class="message ai" id="${typingId}">
                    <div class="avatar">AI</div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                </div>
            `);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const res = await fetch('https://inquiry-ai.ep10.workers.dev', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text })
                });
                
                if (!res.ok) throw new Error('API Error');
                const data = await res.json();
                
                // Remove typing and add response
                document.getElementById(typingId).remove();
                appendMessage('ai', data.response);

            } catch (error) {
                document.getElementById(typingId).remove();
                appendMessage('ai', 'Connection error. Please try again later.');
            }
        }

        function appendMessage(role, content) {
            const htmlContent = role === 'ai' ? marked.parse(content) : content.replace(/\n/g, '<br>');
            const msgHtml = `
                <div class="message ${role}">
                    <div class="avatar">${role === 'ai' ? 'AI' : 'U'}</div>
                    <div class="message-content">${htmlContent}</div>
                </div>
            `;
            messageContainer.insertAdjacentHTML('beforeend', msgHtml);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
    </script>
</body>
</html>
