<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry AI Problem Solver – Math, Science & Finance Workspace</title>
    <meta name="description" content="Step-by-step AI problem solver for math, physics, chemistry, and financial calculations with image vision OCR support.">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="/favicon.ico" sizes="48x48">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- Marked.js for clean Markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        /* Chat Layout Overrides */
        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: var(--bg);
        }

        .chat-app {
            display: flex;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* Sidebar */
        .chat-sidebar {
            width: 280px;
            background: var(--card-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.2s ease;
        }

        .sidebar-header {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .sidebar-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-new-chat {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px;
            border-radius: 6px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn-new-chat:hover {
            border-color: var(--border-hover);
            background: var(--border);
        }

        .sidebar-search {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 8px 12px;
            color: var(--text);
            font-size: 0.8rem;
            outline: none;
        }

        .history-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .history-group-title {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 6px;
            padding-left: 8px;
        }

        .session-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 10px;
            border-radius: 6px;
            color: var(--muted);
            font-size: 0.85rem;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.15s ease, color 0.15s ease;
            position: relative;
        }

        .session-item:hover, .session-item.active {
            background: var(--input-bg);
            color: var(--text);
        }

        .session-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 190px;
        }

        .btn-delete-session {
            opacity: 0;
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            padding: 2px 4px;
            transition: opacity 0.15s ease, color 0.15s ease;
        }

        .session-item:hover .btn-delete-session {
            opacity: 1;
        }

        .btn-delete-session:hover {
            color: #ef4444;
        }

        /* Main Workspace */
        .chat-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            background: var(--bg);
            position: relative;
        }

        .chat-header {
            padding: 14px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg);
        }

        .chat-header-title {
            font-weight: 700;
            font-size: 0.95rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-width: 100%;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .message.user {
            align-self: flex-end;
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 12px 12px 2px 12px;
            max-width: 80%;
        }

        .message.assistant {
            align-self: flex-start;
            width: 100%;
            background: transparent;
            border-bottom: 1px solid var(--border);
            padding-bottom: 24px;
        }

        .message-author {
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
        }

        .message-content img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            margin-top: 8px;
            border: 1px solid var(--border);
        }

        /* Input Dock */
        .chat-input-area {
            padding: 16px 24px 24px;
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
        }

        .chat-box {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .chat-box:focus-within {
            border-color: var(--border-hover);
        }

        .attachment-preview {
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--input-bg);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: var(--muted);
            width: fit-content;
        }

        .attachment-preview.active {
            display: flex;
        }

        .attachment-preview img {
            height: 32px;
            width: 32px;
            object-fit: cover;
            border-radius: 4px;
        }

        .remove-attachment {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
        }

        .chat-box textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            resize: none;
            min-height: 48px;
            max-height: 160px;
        }

        .chat-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .control-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-submit-chat {
            background: var(--text);
            color: var(--bg);
            border: none;
            border-radius: 6px;
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: opacity 0.15s ease;
        }

        .btn-submit-chat:hover {
            opacity: 0.9;
        }

        /* Responsive Mobile Drawer */
        @media (max-width: 768px) {
            .chat-sidebar {
                position: fixed;
                top: 0; left: 0; bottom: 0;
                z-index: 200;
                transform: translateX(-100%);
            }
            .chat-sidebar.open {
                transform: translateX(0);
            }
        }
    </style>
</head>
<body class="chat-layout">

    <div class="chat-app">
        <!-- Sidebar Workspace -->
        <aside class="chat-sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-top">
                    <a href="index.html" class="logo">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4h16v16H4z"></path><path d="M4 10h16"></path><path d="M10 4v16"></path></svg>
                        Inquiry PRO
                    </a>
                </div>
                <button id="newChatBtn" class="btn-new-chat">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                    New Chat
                </button>
                <input type="text" id="sidebarSearch" class="sidebar-search" placeholder="Search chats...">
            </div>

            <div class="history-list" id="historyList">
                <!-- Grouped sessions populated by JS -->
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="chat-main">
            <header class="chat-header">
                <div class="chat-header-title">
                    <button id="toggleSidebar" class="icon-btn" style="display: none;" aria-label="Toggle Sidebar">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
                    </button>
                    <span id="sessionHeaderTitle">AI Problem Solver</span>
                </div>
                <div class="nav-actions">
                    <a href="index.html" class="icon-btn" title="All Calculators">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                    </a>
                    <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    </button>
                </div>
            </header>

            <div class="messages-container" id="messagesContainer">
                <div class="message assistant">
                    <div class="message-author">Inquiry AI</div>
                    <div class="message-content">
                        Hello! I am your AI mathematical and financial problem solver. You can ask me complex questions, upload math screenshots, or attach document data.
                    </div>
                </div>
            </div>

            <!-- Input Dock -->
            <div class="chat-input-area">
                <div class="chat-box">
                    <div class="attachment-preview" id="attachmentPreview">
                        <span id="attachmentName">File attached</span>
                        <button class="remove-attachment" id="removeAttachmentBtn">&times;</button>
                    </div>
                    <textarea id="chatInput" placeholder="Ask AI a math, physics, or finance problem..." rows="1"></textarea>
                    <div class="chat-controls">
                        <div class="control-left">
                            <button id="attachBtn" class="icon-btn" title="Attach file or image">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                            </button>
                            <input type="file" id="fileInput" accept="image/*,.txt,.csv,.md" style="display: none;">
                        </div>
                        <button id="sendBtn" class="btn-submit-chat" aria-label="Send">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // --- Configuration & Endpoint ---
        const WORKER_URL = 'https://inquiry-ai.reubanjhegarty.workers.dev/';
        
        // --- State Management ---
        let sessions = JSON.parse(localStorage.getItem('inquiry_sessions') || '[]');
        let currentSessionId = null;
        let activeAttachment = null; // { type: 'image'|'text', data: string, name: string }

        // --- DOM Elements ---
        const historyList = document.getElementById('historyList');
        const sidebarSearch = document.getElementById('sidebarSearch');
        const messagesContainer = document.getElementById('messagesContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const attachBtn = document.getElementById('attachBtn');
        const fileInput = document.getElementById('fileInput');
        const attachmentPreview = document.getElementById('attachmentPreview');
        const attachmentName = document.getElementById('attachmentName');
        const removeAttachmentBtn = document.getElementById('removeAttachmentBtn');
        const newChatBtn = document.getElementById('newChatBtn');
        const themeToggle = document.getElementById('themeToggle');

        // --- Theme System ---
        const savedTheme = localStorage.getItem('inquiry_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        themeToggle.addEventListener('click', () => {
            const cur = document.documentElement.getAttribute('data-theme');
            const target = cur === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', target);
            localStorage.setItem('inquiry_theme', target);
        });

        // --- Session Management & Storage ---
        function saveSessions() {
            localStorage.setItem('inquiry_sessions', JSON.stringify(sessions));
            renderSidebar();
        }

        function createNewSession(title = 'New Calculation') {
            const newSession = {
                id: 'session_' + Date.now(),
                title: title,
                timestamp: Date.now(),
                messages: []
            };
            sessions.unshift(newSession);
            currentSessionId = newSession.id;
            saveSessions();
            renderMessages();
            return newSession;
        }

        function getActiveSession() {
            return sessions.find(s => s.id === currentSessionId);
        }

        // --- Date Grouping for Sidebar ---
        function renderSidebar() {
            historyList.innerHTML = '';
            const searchVal = sidebarSearch.value.toLowerCase().trim();

            const filtered = sessions.filter(s => s.title.toLowerCase().includes(searchVal));

            if (filtered.length === 0) {
                historyList.innerHTML = '<div style="font-size:0.8rem; color:var(--muted); padding:8px;">No chat history</div>';
                return;
            }

            const now = new Date();
            const todayStart = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
            const yesterdayStart = todayStart - 86400000;
            const weekStart = todayStart - (86400000 * 7);

            const groups = { Today: [], Yesterday: [], "Previous 7 Days": [], Older: [] };

            filtered.forEach(s => {
                if (s.timestamp >= todayStart) groups.Today.push(s);
                else if (s.timestamp >= yesterdayStart) groups.Yesterday.push(s);
                else if (s.timestamp >= weekStart) groups["Previous 7 Days"].push(s);
                else groups.Older.push(s);
            });

            for (const [groupName, items] of Object.entries(groups)) {
                if (items.length === 0) continue;

                const groupDiv = document.createElement('div');
                const titleDiv = document.createElement('div');
                titleDiv.className = 'history-group-title';
                titleDiv.textContent = groupName;
                groupDiv.appendChild(titleDiv);

                items.forEach(session => {
                    const itemEl = document.createElement('div');
                    itemEl.className = `session-item ${session.id === currentSessionId ? 'active' : ''}`;
                    itemEl.onclick = () => switchSession(session.id);

                    itemEl.innerHTML = `
                        <span class="session-title">${escapeHtml(session.title)}</span>
                        <button class="btn-delete-session" onclick="deleteSession(event, '${session.id}')" title="Delete">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
                        </button>
                    `;
                    groupDiv.appendChild(itemEl);
                });

                historyList.appendChild(groupDiv);
            }
        }

        function switchSession(id) {
            currentSessionId = id;
            renderSidebar();
            renderMessages();
        }

        function deleteSession(e, id) {
            e.stopPropagation();
            sessions = sessions.filter(s => s.id !== id);
            if (currentSessionId === id) {
                currentSessionId = sessions.length > 0 ? sessions[0].id : null;
            }
            saveSessions();
            renderMessages();
        }

        // --- Render Messages ---
        function renderMessages() {
            messagesContainer.innerHTML = '';
            const session = getActiveSession();

            if (!session || session.messages.length === 0) {
                messagesContainer.innerHTML = `
                    <div class="message assistant">
                        <div class="message-author">Inquiry AI</div>
                        <div class="message-content">Hello! I am your AI mathematical and financial problem solver. Ask a prompt, upload math screenshots, or attach document files.</div>
                    </div>
                `;
                document.getElementById('sessionHeaderTitle').textContent = 'AI Problem Solver';
                return;
            }

            document.getElementById('sessionHeaderTitle').textContent = session.title;

            session.messages.forEach(msg => {
                const msgEl = document.createElement('div');
                msgEl.className = `message ${msg.role}`;
                
                let imgHtml = msg.image ? `<br><img src="${msg.image}" alt="Attachment">` : '';
                let contentFormatted = msg.role === 'assistant' ? marked.parse(msg.content) : escapeHtml(msg.content);

                msgEl.innerHTML = `
                    <div class="message-author">${msg.role === 'user' ? 'You' : 'Inquiry AI'}</div>
                    <div class="message-content">${contentFormatted} ${imgHtml}</div>
                `;
                messagesContainer.appendChild(msgEl);
            });

            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // --- Attachment Handler ---
        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            if (file.type.startsWith('image/')) {
                reader.onload = (evt) => {
                    activeAttachment = { type: 'image', data: evt.target.result, name: file.name };
                    attachmentName.textContent = `Image: ${file.name}`;
                    attachmentPreview.classList.add('active');
                };
                reader.readAsDataURL(file);
            } else {
                reader.onload = (evt) => {
                    activeAttachment = { type: 'text', data: evt.target.result, name: file.name };
                    attachmentName.textContent = `Doc: ${file.name}`;
                    attachmentPreview.classList.add('active');
                };
                reader.readAsText(file);
            }
        });

        removeAttachmentBtn.addEventListener('click', () => {
            activeAttachment = null;
            fileInput.value = '';
            attachmentPreview.classList.remove('active');
        });

        // --- Send Request to Worker ---
        async function sendMessage(overrideText = null) {
            const text = overrideText || chatInput.value.trim();
            if (!text && !activeAttachment) return;

            let session = getActiveSession();
            if (!session) {
                session = createNewSession(text.substring(0, 30) || 'New Calculation');
            } else if (session.messages.length === 0 && text) {
                session.title = text.substring(0, 30);
            }

            // User Message Object
            const userMsg = {
                role: 'user',
                content: activeAttachment && activeAttachment.type === 'text' 
                    ? `${text}\n\n[Attached File: ${activeAttachment.name}]\n${activeAttachment.data}`
                    : text,
                image: activeAttachment && activeAttachment.type === 'image' ? activeAttachment.data : null
            };

            session.messages.push(userMsg);
            
            // Clear Inputs
            chatInput.value = '';
            const payloadAttachment = activeAttachment;
            activeAttachment = null;
            attachmentPreview.classList.remove('active');
            fileInput.value = '';

            saveSessions();
            renderMessages();

            // Placeholder AI Thinking Message
            const tempAiMsg = { role: 'assistant', content: 'Computing solution...' };
            session.messages.push(tempAiMsg);
            renderMessages();

            try {
                // Call Cloudflare Worker
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        prompt: userMsg.content,
                        image: userMsg.image
                    })
                });

                const data = await response.json();
                
                // Remove placeholder
                session.messages.pop();

                if (data.response || data.output || data.result) {
                    session.messages.push({
                        role: 'assistant',
                        content: data.response || data.output || data.result
                    });
                } else {
                    session.messages.push({
                        role: 'assistant',
                        content: 'Calculated solution received successfully.'
                    });
                }
            } catch (err) {
                session.messages.pop();
                session.messages.push({
                    role: 'assistant',
                    content: 'Error processing calculation. Please verify endpoint connection.'
                });
            }

            saveSessions();
            renderMessages();
        }

        // --- Utilities & Handlers ---
        function escapeHtml(str) {
            return String(text = str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        sendBtn.addEventListener('click', () => sendMessage());

        chatInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        newChatBtn.addEventListener('click', () => createNewSession());
        sidebarSearch.addEventListener('input', renderSidebar);

        // --- Initial Prompt Handoff from index.html ---
        window.addEventListener('DOMContentLoaded', () => {
            const initialPrompt = sessionStorage.getItem('inquiry_initial_prompt');
            if (initialPrompt) {
                sessionStorage.removeItem('inquiry_initial_prompt');
                createNewSession(initialPrompt.substring(0, 30));
                sendMessage(initialPrompt);
            } else if (sessions.length > 0) {
                currentSessionId = sessions[0].id;
                renderSidebar();
                renderMessages();
            } else {
                renderSidebar();
                renderMessages();
            }
        });
    </script>
</body>
</html>
