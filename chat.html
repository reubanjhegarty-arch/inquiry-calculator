<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Problem Solver | Inquiry Calculator</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
            background-color: var(--bg-color); 
        }

        .chat-layout { 
            display: flex; 
            flex: 1; 
            overflow: hidden; 
            margin-top: 60px; 
        }

        /* Sidebar */
        .chat-sidebar { 
            width: 260px; 
            border-right: 1px solid var(--border-color); 
            display: flex; 
            flex-direction: column; 
            background-color: var(--card-bg); 
            flex-shrink: 0;
        }

        .sidebar-header { 
            padding: 1rem; 
            border-bottom: 1px solid var(--border-color); 
        }

        .btn-new-chat { 
            width: 100%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
            padding: 0.65rem; 
            background: transparent; 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
            border-radius: 6px; 
            cursor: pointer; 
            transition: all 0.2s ease; 
            font-size: 0.875rem; 
            font-weight: 500;
        }

        .btn-new-chat:hover { 
            background: var(--card-bg-hover); 
            border-color: var(--border-color-hover); 
        }

        .chat-history { 
            flex: 1; 
            overflow-y: auto; 
            padding: 0.75rem; 
            display: flex; 
            flex-direction: column; 
            gap: 0.35rem; 
        }

        .history-item { 
            padding: 0.65rem 0.85rem; 
            border-radius: 6px; 
            font-size: 0.85rem; 
            color: var(--text-muted); 
            cursor: pointer; 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            border: 1px solid transparent; 
            transition: all 0.2s ease; 
        }

        .history-item:hover, .history-item.active { 
            background: var(--card-bg-hover); 
            color: var(--text-color); 
            border-color: var(--border-color); 
        }

        /* Main Chat Area */
        .chat-main { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
            position: relative; 
            min-width: 0;
        }

        .chat-messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 2rem 1.5rem; 
            scroll-behavior: smooth; 
        }

        .chat-container { 
            max-width: 800px; 
            margin: 0 auto; 
            display: flex; 
            flex-direction: column; 
            gap: 1.5rem; 
        }

        /* Message Bubbles */
        .message { 
            display: flex; 
            gap: 1rem; 
            line-height: 1.6; 
        }

        .message.user { 
            flex-direction: row-reverse; 
        }

        .avatar { 
            width: 32px; 
            height: 32px; 
            border-radius: 6px; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: 700; 
            flex-shrink: 0; 
            font-size: 0.8rem; 
        }

        .message.ai .avatar { 
            background: var(--text-color); 
            color: var(--bg-color); 
        }

        .message.user .avatar { 
            background: var(--card-bg-hover); 
            border: 1px solid var(--border-color); 
            color: var(--text-color); 
        }

        .message-content { 
            max-width: 82%; 
            font-size: 0.95rem; 
        }

        .message.ai .message-content { 
            color: var(--text-color); 
            padding: 0.25rem 0;
        }

        .message.user .message-content { 
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            padding: 0.75rem 1rem; 
            border-radius: 6px; 
            color: var(--text-color); 
        }

        .attached-img-preview {
            max-width: 280px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            margin-bottom: 0.5rem;
            display: block;
        }

        /* Input Area & File Bar */
        .chat-input-wrapper { 
            padding: 1.25rem 1.5rem 1.5rem; 
            background: linear-gradient(to top, var(--bg-color) 85%, transparent); 
            position: sticky; 
            bottom: 0; 
        }

        .chat-input-container { 
            max-width: 800px; 
            margin: 0 auto; 
            position: relative; 
            display: flex; 
            flex-direction: column;
            background: var(--card-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 8px; 
            transition: border-color 0.2s ease, box-shadow 0.2s ease; 
            box-shadow: 0 8px 24px rgba(0,0,0,0.4); 
        }

        .chat-input-container:focus-within { 
            border-color: var(--text-color); 
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px var(--text-color); 
        }

        /* Attachment Preview Chip */
        .file-preview-bar {
            display: none;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.85rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .file-preview-bar.active {
            display: flex;
        }

        .file-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: var(--card-bg-hover);
            border: 1px solid var(--border-color);
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            color: var(--text-color);
            font-weight: 500;
        }

        .file-chip-remove {
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
        }

        .file-chip-remove:hover {
            color: var(--text-color);
        }

        .input-row {
            display: flex;
            align-items: flex-end;
            width: 100%;
        }

        .chat-input { 
            flex: 1; 
            background: transparent; 
            border: none; 
            color: var(--text-color); 
            padding: 0.85rem 0.75rem; 
            font-family: inherit; 
            font-size: 0.95rem; 
            resize: none; 
            max-height: 180px; 
            outline: none; 
        }

        .chat-input::placeholder { 
            color: var(--text-muted); 
        }

        .btn-attach {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s ease;
        }

        .btn-attach:hover {
            color: var(--text-color);
        }

        .btn-send { 
            background: var(--text-color); 
            color: var(--bg-color); 
            border: none; 
            border-radius: 6px; 
            padding: 0.5rem 0.85rem; 
            margin: 0.4rem; 
            cursor: pointer; 
            transition: opacity 0.2s ease; 
            font-weight: 600; 
            font-size: 0.85rem; 
        }

        .btn-send:hover { 
            opacity: 0.85; 
        }

        /* Sharp Bouncing Square Animation */
        .typing-indicator { 
            display: flex; 
            gap: 5px; 
            align-items: center; 
            padding: 0.5rem 0; 
        }

        .dot { 
            width: 6px; 
            height: 6px; 
            background-color: var(--text-muted); 
            border-radius: 1px; 
            animation: sharpBounce 1.4s infinite ease-in-out both; 
        }

        .dot:nth-child(1) { animation-delay: -0.32s; }
        .dot:nth-child(2) { animation-delay: -0.16s; }

        @keyframes sharpBounce {
            0%, 80%, 100% { transform: scale(0.3); opacity: 0.3; }
            40% { transform: scale(1); opacity: 1; background-color: var(--text-color); }
        }

        @media (max-width: 768px) {
            .chat-sidebar { display: none; }
            .message-content { max-width: 90%; }
        }
    </style>
</head>
<body>

    <!-- Header Navigation -->
    <header class="glass-header">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 4h16v16H4z"></path><path d="M4 10h16"></path><path d="M10 4v16"></path></svg>
                Inquiry Calculator
            </a>
            <div class="nav-actions">
                <button id="themeToggle" class="icon-btn" aria-label="Toggle Theme">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </div>
    </header>

    <div class="chat-layout">
        <!-- Sidebar History -->
        <aside class="chat-sidebar">
            <div class="sidebar-header">
                <button class="btn-new-chat" onclick="startNewChat()">+ New Chat</button>
            </div>
            <div class="chat-history" id="chatHistory"></div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-main">
            <div class="chat-messages" id="chatMessages">
                <div class="chat-container" id="messageContainer">
                    <div class="message ai">
                        <div class="avatar">AI</div>
                        <div class="message-content">Hello! Ask me any question, or upload an image/screenshot of a math problem or document to analyze.</div>
                    </div>
                </div>
            </div>

            <div class="chat-input-wrapper">
                <div class="chat-input-container">
                    <!-- Preview Bar for Attached Files -->
                    <div class="file-preview-bar" id="filePreviewBar">
                        <span>Attached:</span>
                        <div class="file-chip">
                            <span id="fileChipName">screenshot.png</span>
                            <span class="file-chip-remove" onclick="clearAttachedFile()">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                            </span>
                        </div>
                    </div>

                    <div class="input-row">
                        <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Attach image or file">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                        </button>
                        <input type="file" id="fileInput" style="display: none;" accept="image/*,.txt,.csv,.json,.md" onchange="handleFileSelect(event)">
                        
                        <textarea class="chat-input" id="chatInput" rows="1" placeholder="Type your problem or attach a photo/document..."></textarea>
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()">Send</button>
                    </div>
                </div>
                <div style="text-align: center; font-size: 0.75rem; color: var(--text-muted); margin-top: 0.5rem;">
                    Supports math screenshots, images, CSVs, and text documents.
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        const chatInput = document.getElementById('chatInput');
        const messageContainer = document.getElementById('messageContainer');
        const chatMessages = document.getElementById('chatMessages');
        const chatHistoryEl = document.getElementById('chatHistory');
        const filePreviewBar = document.getElementById('filePreviewBar');
        const fileChipName = document.getElementById('fileChipName');

        let activeFile = null; // Stores file object + data

        // Auto-resize textarea
        chatInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
            if (!this.value.trim()) this.style.height = 'auto';
        });

        // Submit on Enter
        chatInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Theme Toggle
        const themeToggle = document.getElementById('themeToggle');
        const root = document.documentElement;
        function setTheme(t) {
            root.setAttribute('data-theme', t);
            localStorage.setItem('inquiry_theme', t);
        }
        setTheme(localStorage.getItem('inquiry_theme') || 'dark');
        themeToggle.addEventListener('click', () => setTheme(root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'));

        // Handle File Selection
        function handleFileSelect(e) {
            const file = e.target.files[0];
            if (!file) return;

            const isImage = file.type.startsWith('image/');
            const reader = new FileReader();

            if (isImage) {
                reader.onload = function(evt) {
                    const arrayBuffer = evt.target.result;
                    const byteArray = Array.from(new Uint8Array(arrayBuffer));
                    const dataUrlReader = new FileReader();
                    dataUrlReader.onload = function(dEvt) {
                        activeFile = {
                            name: file.name,
                            type: 'image',
                            byteArray: byteArray,
                            dataUrl: dEvt.target.result
                        };
                        fileChipName.innerText = file.name;
                        filePreviewBar.classList.add('active');
                    };
                    dataUrlReader.readAsDataURL(file);
                };
                reader.readAsArrayBuffer(file);
            } else {
                // Text/CSV/JSON
                reader.onload = function(evt) {
                    activeFile = {
                        name: file.name,
                        type: 'text',
                        textContent: evt.target.result
                    };
                    fileChipName.innerText = file.name;
                    filePreviewBar.classList.add('active');
                };
                reader.readAsText(file);
            }
        }

        function clearAttachedFile() {
            activeFile = null;
            document.getElementById('fileInput').value = '';
            filePreviewBar.classList.remove('active');
        }

        function startNewChat() {
            clearAttachedFile();
            messageContainer.innerHTML = `
                <div class="message ai">
                    <div class="avatar">AI</div>
                    <div class="message-content">New conversation started. What can I solve for you?</div>
                </div>`;
            chatInput.focus();
        }

        async function sendMessage() {
            const text = chatInput.value.trim();
            if (!text && !activeFile) return;

            let userMsgHtml = text;
            if (activeFile && activeFile.type === 'image') {
                userMsgHtml = `<img src="${activeFile.dataUrl}" class="attached-img-preview"><br>` + (text || 'Analyze this image.');
            } else if (activeFile && activeFile.type === 'text') {
                userMsgHtml = `<strong>[File Attached: ${activeFile.name}]</strong><br>` + (text || 'Process this document.');
            }

            appendMessage('user', userMsgHtml, true);

            // Construct payload
            let finalPrompt = text;
            let imageArrayPayload = null;

            if (activeFile) {
                if (activeFile.type === 'image') {
                    imageArrayPayload = activeFile.byteArray;
                    if (!finalPrompt) finalPrompt = 'Solve and explain the problem in this image step-by-step.';
                } else if (activeFile.type === 'text') {
                    finalPrompt = `Attached Document (${activeFile.name}):\n"""\n${activeFile.textContent}\n"""\n\nUser Question: ${text || 'Please summarize or solve the contents of this document.'}`;
                }
            }

            chatInput.value = '';
            chatInput.style.height = 'auto';
            clearAttachedFile();

            const typingId = 'typing-' + Date.now();
            messageContainer.insertAdjacentHTML('beforeend', `
                <div class="message ai" id="${typingId}">
                    <div class="avatar">AI</div>
                    <div class="message-content">
                        <div class="typing-indicator">
                            <div class="dot"></div>
                            <div class="dot"></div>
                            <div class="dot"></div>
                        </div>
                    </div>
                </div>
            `);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('https://inquiry-ai.reubanjhegarty.workers.dev/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        prompt: finalPrompt,
                        imageArray: imageArrayPayload
                    })
                });

                document.getElementById(typingId)?.remove();

                if (!response.ok) {
                    const errData = await response.json().catch(() => ({}));
                    appendMessage('ai', `**Backend Error:** ${errData.error || response.statusText}`);
                    return;
                }

                const data = await response.json();
                appendMessage('ai', data.response || 'No response.');
                saveChatHistory(text || 'File analysis');

            } catch (err) {
                document.getElementById(typingId)?.remove();
                appendMessage('ai', `**Network Error:** Could not reach AI server (${err.message}).`);
            }
        }

        function appendMessage(role, content, isRawHtml = false) {
            const parsed = (role === 'ai' && !isRawHtml) ? marked.parse(content) : content;
            const html = `
                <div class="message ${role}">
                    <div class="avatar">${role === 'ai' ? 'AI' : 'U'}</div>
                    <div class="message-content">${parsed}</div>
                </div>
            `;
            messageContainer.insertAdjacentHTML('beforeend', html);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function saveChatHistory(prompt) {
            let histories = JSON.parse(localStorage.getItem('inquiry_chat_history') || '[]');
            histories.unshift({ title: prompt, date: new Date().toLocaleTimeString() });
            if (histories.length > 20) histories.pop();
            localStorage.setItem('inquiry_chat_history', JSON.stringify(histories));
            renderHistoryUI();
        }

        function renderHistoryUI() {
            let histories = JSON.parse(localStorage.getItem('inquiry_chat_history') || '[]');
            chatHistoryEl.innerHTML = histories.map(item => `
                <div class="history-item" title="${item.title}">${item.title}</div>
            `).join('');
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderHistoryUI();
            const pending = sessionStorage.getItem('pending_question');
            if (pending) {
                sessionStorage.removeItem('pending_question');
                chatInput.value = pending;
                sendMessage();
            }
        });
    </script>
</body>
</html>
