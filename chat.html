<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Problem Solver | Inquiry Calculator</title>
    <meta name="description" content="Ask the Inquiry Calculator AI any math, science, or finance question and get a step by step solution.">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2">

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        [hidden] { display: none !important; }

        :root {
            --cream: #F6F1E7;
            --brown: #8A6D4F;
            --brown-hover: #6E553D;
            --dark: #2E2318;
            --line: #E4DACD;
            --muted: #7A6A5A;
        }

        html, body { height: 100%; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--cream);
            color: var(--dark);
            line-height: 1.55;
            overflow: hidden;
        }
        a { color: inherit; text-decoration: none; }

        .app { display: flex; height: 100vh; }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 270px;
            flex-shrink: 0;
            background: var(--dark);
            color: var(--cream);
            display: flex;
            flex-direction: column;
            border-right: 2px solid var(--brown);
        }
        .brand {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            border-bottom: 1px solid #4A3A2A;
        }
        .brand span { color: var(--brown); }
        .new-chat {
            margin: 16px;
            padding: 12px;
            background: var(--brown);
            color: #fff;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .new-chat:hover { background: var(--brown-hover); }
        .history-label {
            padding: 10px 20px 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--brown);
            font-weight: 700;
        }
        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 0 10px 10px;
        }
        .chat-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 12px;
            margin-bottom: 2px;
            border-radius: 4px;
            cursor: pointer;
            color: #D5C9BC;
            font-size: 0.88rem;
            transition: background 0.15s;
        }
        .chat-item:hover { background: #4A3A2A; color: #fff; }
        .chat-item.active { background: var(--brown); color: #fff; }
        .chat-title {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-del {
            background: none;
            border: none;
            color: inherit;
            opacity: 0.5;
            font-size: 1.1rem;
            line-height: 1;
            padding: 2px 6px;
            border-radius: 2px;
            cursor: pointer;
        }
        .chat-del:hover { opacity: 1; background: rgba(0, 0, 0, 0.25); }
        .empty-list {
            padding: 10px 12px;
            font-size: 0.85rem;
            color: #A8977F;
        }
        .sidebar-foot {
            padding: 14px 20px;
            border-top: 1px solid #4A3A2A;
            font-size: 0.85rem;
        }
        .sidebar-foot a { color: var(--brown); }
        .sidebar-foot a:hover { color: #fff; }

        .overlay { display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); z-index: 50; }
        .overlay.open { display: block; }

        /* ===== MAIN ===== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 24px;
            background: #fff;
            border-bottom: 1px solid var(--line);
        }
        .topbar-left { display: flex; align-items: center; gap: 12px; }
        .topbar h1 { font-size: 1.05rem; font-weight: 700; }
        .menu-btn {
            display: none;
            background: var(--dark);
            color: var(--cream);
            border: none;
            border-radius: 4px;
            padding: 6px 12px;
            font-family: inherit;
            font-size: 0.85rem;
            cursor: pointer;
        }
        .auth { display: flex; align-items: center; gap: 14px; font-size: 0.9rem; }
        .auth .link { color: var(--brown); font-weight: 600; }
        .user-name { color: var(--brown); font-weight: 600; }

        .btn {
            display: inline-block;
            padding: 7px 16px;
            border: none;
            border-radius: 4px;
            background: var(--brown);
            color: #fff;
            font-family: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:hover { background: var(--brown-hover); }
        .btn.dark { background: var(--dark); }
        .btn.dark:hover { background: #000; }

        /* ===== MESSAGES ===== */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 28px 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .welcome {
            margin: auto;
            text-align: center;
            max-width: 520px;
            color: var(--muted);
        }
        .welcome h2 {
            font-size: 1.6rem;
            color: var(--dark);
            margin-bottom: 10px;
        }

        .msg {
            display: flex;
            flex-direction: column;
            max-width: min(760px, 88%);
        }
        .msg.user { align-self: flex-end; align-items: flex-end; }
        .msg.ai { align-self: flex-start; align-items: flex-start; }

        .who {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
            color: var(--brown);
            margin-bottom: 6px;
        }
        .bubble {
            padding: 14px 18px;
            border-radius: 4px;
            font-size: 0.95rem;
            overflow-wrap: anywhere;
        }
        .msg.user .bubble {
            background: var(--brown);
            color: #fff;
        }
        .msg.ai .bubble {
            background: #fff;
            border: 1px solid var(--line);
            color: var(--dark);
        }
        .bubble.error {
            background: #FFF8F6;
            border-color: #C0392B;
            color: #7A2219;
        }
        .bubble p { margin-bottom: 6px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble .h { font-weight: 700; font-size: 1rem; margin: 10px 0 4px; }
        .bubble ul { padding-left: 20px; margin: 4px 0 8px; }
        .bubble li { margin-bottom: 3px; }
        .bubble .gap { height: 6px; }
        .bubble code {
            background: #F6F1E7;
            color: var(--dark);
            padding: 1px 6px;
            border-radius: 2px;
            font-family: Consolas, Menlo, monospace;
            font-size: 0.9em;
        }
        .msg.user .bubble code { background: rgba(255, 255, 255, 0.2); color: #fff; }

        /* Bouncing dots */
        .dots {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 16px 18px;
        }
        .dots span {
            width: 8px;
            height: 8px;
            background: var(--brown);
            border-radius: 50%;
            animation: jump 1.2s infinite ease-in-out;
        }
        .dots span:nth-child(2) { animation-delay: 0.15s; }
        .dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes jump {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        /* ===== INPUT ===== */
        .input-bar {
            padding: 14px 24px 16px;
            background: #fff;
            border-top: 1px solid var(--line);
        }
        .input-row {
            display: flex;
            gap: 12px;
            max-width: 820px;
            margin: 0 auto;
        }
        .input-row textarea {
            flex: 1;
            resize: none;
            min-height: 48px;
            max-height: 160px;
            padding: 13px 14px;
            border: 1.5px solid #D5C9BC;
            border-radius: 4px;
            background: #FDFBF7;
            color: var(--dark);
            font-family: inherit;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .input-row textarea:focus { outline: none; border-color: var(--brown); }
        .send { padding: 0 26px; }
        .limit-note {
            max-width: 820px;
            margin: 8px auto 0;
            text-align: center;
            font-size: 0.78rem;
            color: var(--brown);
        }
        .limit-note.error { color: #C0392B; }

        /* ===== MOBILE ===== */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                top: 0;
                bottom: 0;
                left: 0;
                z-index: 60;
                transform: translateX(-100%);
                transition: transform 0.25s ease;
            }
            .sidebar.open { transform: translateX(0); }
            .menu-btn { display: inline-block; }
            .topbar { padding: 12px 16px; }
            .messages { padding: 20px 14px; }
            .input-bar { padding: 12px 14px; }
            .user-name { display: none; }
        }
    </style>
</head>
<body>
<div class="app">

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
        <div class="brand"><a href="/">Inquiry<span>Calculator</span></a></div>
        <button class="new-chat" id="new-chat-btn">+ New Chat</button>
        <div class="history-label">Previous Chats</div>
        <div class="chat-list" id="chat-list"></div>
        <div class="sidebar-foot"><a href="/">Back to calculators</a></div>
    </aside>
    <div class="overlay" id="overlay"></div>

    <!-- MAIN -->
    <main class="main">
        <header class="topbar">
            <div class="topbar-left">
                <button class="menu-btn" id="menu-btn" aria-label="Open chat list">Chats</button>
                <h1>AI Problem Solver</h1>
            </div>
            <div class="auth" id="auth-guest">
                <a href="/login.html" class="link">Log In</a>
                <a href="/signup.html" class="btn">Sign Up</a>
            </div>
            <div class="auth" id="auth-user" hidden>
                <span class="user-name" id="user-name"></span>
                <button class="btn dark" id="logout-btn">Log Out</button>
            </div>
        </header>

        <section class="messages" id="messages">
            <div class="welcome" id="welcome">
                <h2>What do you need to solve?</h2>
                <p>Ask any math, science, or finance question. The solver works through it step by step.</p>
            </div>
        </section>

        <footer class="input-bar">
            <div class="input-row">
                <textarea id="chat-input" rows="1" placeholder="Ask a question..."></textarea>
                <button class="btn send" id="send-btn">Send</button>
            </div>
            <div class="limit-note" id="limit-note"></div>
        </footer>
    </main>
</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script>
    // ===== CONFIG =====
    // Paste the EXACT URL from the browser tab that showed "Worker is running correctly!"
    const WORKER_URL = 'https://inquiry-ai.reubanjhegarty.workers.dev/';

    const STORAGE_KEY = 'inquiry_chats';
    const FREE_DAILY_LIMIT = 3;
    const SYSTEM_INSTRUCTION = 'You are a patient, accurate math, science, and finance tutor. Solve the problem step by step, show the key formulas, and state the final answer clearly.';

    const firebaseConfig = {
        apiKey: "AIzaSyCvfgVqm4bXuA-5BOG8wLxOPlb-En0WUzI",
        authDomain: "inquiry-calculator.firebaseapp.com",
        projectId: "inquiry-calculator",
        storageBucket: "inquiry-calculator.appspot.com",
        messagingSenderId: "169894862498",
        appId: "1:169894862498:web:YOUR_APP_ID"
    };

    // ===== STATE =====
    const $ = id => document.getElementById(id);
    let chats = loadChats();
    let currentId = null;
    let busy = false;
    let isLoggedIn = false;
    let initialised = false;

    // ===== STORAGE =====
    function loadChats() {
        try {
            const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
            return Array.isArray(data) ? data : [];
        } catch (e) {
            return [];
        }
    }

    function saveChats() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(chats));
    }

    function currentChat() {
        return chats.find(c => c.id === currentId) || null;
    }

    function createChat() {
        const chat = {
            id: 'c' + Date.now() + Math.random().toString(36).slice(2, 7),
            title: 'New chat',
            messages: [],
            updated: Date.now()
        };
        chats.unshift(chat);
        currentId = chat.id;
        saveChats();
        return chat;
    }

    // ===== GUEST LIMIT (shares the same key as index.html) =====
    function todayStr() {
        return new Date().toDateString();
    }

    function usedToday() {
        const today = todayStr();
        return JSON.parse(localStorage.getItem('ai_usage') || '[]').filter(d => d === today).length;
    }

    function recordUsage() {
        const today = todayStr();
        const list = JSON.parse(localStorage.getItem('ai_usage') || '[]').filter(d => d === today);
        list.push(today);
        localStorage.setItem('ai_usage', JSON.stringify(list));
    }

    function canAsk() {
        return isLoggedIn || usedToday() < FREE_DAILY_LIMIT;
    }

    function setLimitNote(text, isError) {
        const el = $('limit-note');
        el.textContent = text;
        el.classList.toggle('error', !!isError);
    }

    function updateLimitNote() {
        if (isLoggedIn) {
            setLimitNote('Unlimited access. You are logged in.');
        } else {
            const left = Math.max(0, FREE_DAILY_LIMIT - usedToday());
            setLimitNote(left + ' of ' + FREE_DAILY_LIMIT + ' free questions left today. Log in for unlimited access.');
        }
    }

    // ===== FORMATTING =====
    function escapeHtml(s) {
        return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function inline(s) {
        return s
            .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
            .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function formatText(text) {
        const lines = escapeHtml(String(text || '')).split('\n');
        let html = '';
        let inList = false;

        for (const raw of lines) {
            const line = raw.trimEnd();
            const heading = line.match(/^(#{1,3})\s+(.*)$/);
            const bullet = line.match(/^\s*[-*]\s+(.*)$/);

            if (bullet) {
                if (!inList) { html += '<ul>'; inList = true; }
                html += '<li>' + inline(bullet[1]) + '</li>';
                continue;
            }
            if (inList) { html += '</ul>'; inList = false; }

            if (heading) {
                html += '<div class="h">' + inline(heading[2]) + '</div>';
            } else if (line.trim() === '') {
                html += '<div class="gap"></div>';
            } else {
                html += '<p>' + inline(line) + '</p>';
            }
        }
        if (inList) html += '</ul>';
        return html;
    }

    // ===== RENDERING =====
    function renderSidebar() {
        const list = $('chat-list');
        list.innerHTML = '';

        if (!chats.length) {
            const empty = document.createElement('div');
            empty.className = 'empty-list';
            empty.textContent = 'No previous chats yet.';
            list.appendChild(empty);
            return;
        }

        [...chats].sort((a, b) => b.updated - a.updated).forEach(chat => {
            const row = document.createElement('div');
            row.className = 'chat-item' + (chat.id === currentId ? ' active' : '');

            const title = document.createElement('span');
            title.className = 'chat-title';
            title.textContent = chat.title;

            const del = document.createElement('button');
            del.className = 'chat-del';
            del.textContent = '×';
            del.title = 'Delete chat';
            del.setAttribute('aria-label', 'Delete chat');
            del.addEventListener('click', e => {
                e.stopPropagation();
                deleteChat(chat.id);
            });

            row.append(title, del);
            row.addEventListener('click', () => openChat(chat.id));
            list.appendChild(row);
        });
    }

    function buildMessage(role, content, isError) {
        const wrap = document.createElement('div');
        wrap.className = 'msg ' + role;

        const who = document.createElement('div');
        who.className = 'who';
        who.textContent = role === 'user' ? 'You' : 'Solver';

        const bubble = document.createElement('div');
        bubble.className = 'bubble' + (isError ? ' error' : '');
        bubble.innerHTML = formatText(content);

        wrap.append(who, bubble);
        return wrap;
    }

    function scrollBottom() {
        const box = $('messages');
        box.scrollTop = box.scrollHeight;
    }

    function appendMessage(role, content, isError) {
        $('welcome').hidden = true;
        $('messages').appendChild(buildMessage(role, content, isError));
        scrollBottom();
    }

    function renderMessages() {
        const box = $('messages');
        box.querySelectorAll('.msg').forEach(n => n.remove());

        const chat = currentChat();
        $('welcome').hidden = !!(chat && chat.messages.length);

        if (chat) {
            chat.messages.forEach(m => box.appendChild(buildMessage(m.role, m.content, false)));
        }
        scrollBottom();
    }

    function showTyping() {
        $('welcome').hidden = true;
        const el = document.createElement('div');
        el.className = 'msg ai typing';
        el.id = 'typing';
        el.innerHTML = '<div class="who">Solver</div><div class="bubble dots"><span></span><span></span><span></span></div>';
        $('messages').appendChild(el);
        scrollBottom();
    }

    function hideTyping() {
        const el = $('typing');
        if (el) el.remove();
    }

    function setBusy(on) {
        busy = on;
        $('send-btn').disabled = on;
    }

    // ===== CHAT ACTIONS =====
    function openChat(id) {
        if (busy) return;
        currentId = id;
        renderSidebar();
        renderMessages();
        closeSidebar();
    }

    function newChat() {
        if (busy) return;
        currentId = null;
        renderSidebar();
        renderMessages();
        closeSidebar();
        $('chat-input').focus();
    }

    function deleteChat(id) {
        if (busy) return;
        if (!confirm('Delete this chat?')) return;
        chats = chats.filter(c => c.id !== id);
        saveChats();
        if (currentId === id) {
            currentId = chats.length ? [...chats].sort((a, b) => b.updated - a.updated)[0].id : null;
        }
        renderSidebar();
        renderMessages();
    }

    function buildPrompt(messages) {
        const recent = messages.slice(-8)
            .map(m => (m.role === 'user' ? 'User: ' : 'Assistant: ') + m.content)
            .join('\n\n');
        return SYSTEM_INSTRUCTION + '\n\n' + recent + '\n\nAssistant:';
    }

    async function askWorker(prompt) {
        const res = await fetch(WORKER_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt })
        });

        let data = {};
        try { data = await res.json(); } catch (e) { /* non-JSON response */ }

        if (!res.ok || !data.answer) {
            throw new Error(data.error || ('Server responded with status ' + res.status));
        }
        return data.answer;
    }

    function friendlyError(err) {
        if (err instanceof TypeError) {
            return 'Could not reach the AI server. Check that WORKER_URL in chat.html matches your Worker URL exactly.';
        }
        return 'The solver ran into a problem: ' + err.message + '. Please try again.';
    }

    async function sendQuestion(question) {
        question = question.trim();
        if (!question || busy) return;

        if (!canAsk()) {
            setLimitNote('Daily limit reached. Log in for unlimited access.', true);
            return;
        }
        if (!isLoggedIn) recordUsage();

        if (!currentChat()) createChat();
        const chat = currentChat();

        chat.messages.push({ role: 'user', content: question });
        if (chat.messages.filter(m => m.role === 'user').length === 1) {
            chat.title = question.length > 42 ? question.slice(0, 42) + '...' : question;
        }
        chat.updated = Date.now();
        saveChats();
        renderSidebar();
        appendMessage('user', question, false);

        setBusy(true);
        showTyping();

        try {
            const answer = await askWorker(buildPrompt(chat.messages));
            hideTyping();
            chat.messages.push({ role: 'ai', content: answer });
            chat.updated = Date.now();
            saveChats();
            renderSidebar();
            appendMessage('ai', answer, false);
        } catch (err) {
            console.error('AI request failed:', err);
            hideTyping();
            appendMessage('ai', friendlyError(err), true);
        } finally {
            setBusy(false);
            updateLimitNote();
            $('chat-input').focus();
        }
    }

    function submitInput() {
        const input = $('chat-input');
        const question = input.value.trim();
        if (!question || busy) return;

        if (!canAsk()) {
            setLimitNote('Daily limit reached. Log in for unlimited access.', true);
            return;
        }

        input.value = '';
        autosize();
        sendQuestion(question);
    }

    // ===== SIDEBAR (MOBILE) =====
    function openSidebar() {
        $('sidebar').classList.add('open');
        $('overlay').classList.add('open');
    }

    function closeSidebar() {
        $('sidebar').classList.remove('open');
        $('overlay').classList.remove('open');
    }

    // ===== INPUT HANDLERS =====
    function autosize() {
        const el = $('chat-input');
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 160) + 'px';
    }

    $('chat-input').addEventListener('input', autosize);

    $('chat-input').addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
            e.preventDefault();
            submitInput();
        }
    });

    $('send-btn').addEventListener('click', submitInput);
    $('new-chat-btn').addEventListener('click', newChat);
    $('menu-btn').addEventListener('click', () => {
        $('sidebar').classList.contains('open') ? closeSidebar() : openSidebar();
    });
    $('overlay').addEventListener('click', closeSidebar);

    // ===== AUTH =====
    function init() {
        if (initialised) return;
        initialised = true;

        renderSidebar();

        // Question sent from the homepage
        const pending = sessionStorage.getItem('pending_question');
        if (pending) {
            sessionStorage.removeItem('pending_question');
            currentId = null;
            renderMessages();
            sendQuestion(pending);
            return;
        }

        // Otherwise resume the most recent chat
        if (chats.length) {
            currentId = [...chats].sort((a, b) => b.updated - a.updated)[0].id;
        }
        renderSidebar();
        renderMessages();
        updateLimitNote();
    }

    function applyAuthState(user) {
        isLoggedIn = !!user;
        $('auth-guest').hidden = isLoggedIn;
        $('auth-user').hidden = !isLoggedIn;
        if (user) $('user-name').textContent = user.displayName || user.email || '';
        updateLimitNote();
    }

    if (typeof firebase !== 'undefined') {
        firebase.initializeApp(firebaseConfig);
        firebase.auth().onAuthStateChanged(user => {
            applyAuthState(user);
            init();
        });
        $('logout-btn').addEventListener('click', () => firebase.auth().signOut());
    } else {
        applyAuthState(null);
        init();
    }
</script>
</body>
</html>
