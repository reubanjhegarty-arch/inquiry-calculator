<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Add, subtract, multiply and divide fractions."><title>Fraction Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/fraction-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Fraction Calculator</h1><p>Add, subtract, multiply and divide fractions.</p><form id="f"><label>Fraction 1 (a/b)</label><div style="display:flex;gap:8px"><input type="number" id="n1" placeholder="1"><input type="number" id="d1" placeholder="2"></div><label>Operation</label><select id="op"><option value="+">+</option><option value="-">-</option><option value="*">*</option><option value="/">/</option></select><label>Fraction 2 (c/d)</label><div style="display:flex;gap:8px"><input type="number" id="n2" placeholder="1"><input type="number" id="d2" placeholder="3"></div><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let a=+n1.value,b=+d1.value,c=+n2.value,d=+d2.value,rN,rD;if(op.value=='+'){rN=a*d+c*b;rD=b*d}else if(op.value=='-'){rN=a*d-c*b;rD=b*d}else if(op.value=='*'){rN=a*c;rD=b*d}else{rN=a*d;rD=b*c}result.innerHTML=rN+'/'+rD+' = '+(rN/rD).toFixed(4);result.style.display='block'}</script></body></html>
