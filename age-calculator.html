<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate exact age in years, months, days."><title>Age Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/age-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Age Calculator</h1><p>Calculate exact age in years, months, days.</p><form id="f"><label>Date of Birth</label><input type="date" id="dob" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let dobD=new Date(dob.value),now=new Date(),y=now.getFullYear()-dobD.getFullYear(),m=now.getMonth()-dobD.getMonth(),d=now.getDate()-dobD.getDate();if(d<0){m--;let pm=new Date(now.getFullYear(),now.getMonth(),0).getDate();d+=pm}if(m<0){y--;m+=12}result.innerHTML=y+' years '+m+' months '+d+' days';result.style.display='block'}</script></body></html>
