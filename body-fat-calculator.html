<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Fat Calculator — Inquiry Calculator</title>
    <meta name="description" content="Navy method (estimate).">
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('inquiry_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Inquiry <span class="logo-badge">PRO</span></a>
            <div class="nav-links">
                <a href="/">All Calculators</a>
                <a href="/chat.html">AI Solver</a>
            </div>
        </div>
    </nav>
    <main class="wrap">
        <h1>Body Fat Calculator</h1>
        <p>Navy method (estimate).</p>
        <form onsubmit="event.preventDefault(); calculate();">
            <div class="form-group"><label>Waist (cm)</label><input type="number" id="w" placeholder="Enter waist (cm)" required></div>
            <div class="form-group"><label>Neck (cm)</label><input type="number" id="n" placeholder="Enter neck (cm)" required></div>
            <div class="form-group"><label>Height (cm)</label><input type="number" id="h" placeholder="Enter height (cm)" required></div>
            <button type="submit">Calculate</button>
        </form>
        <div id="result" class="result" style="display:none;">
            Result: <strong id="output-val">0</strong>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Inquiry Calculator. &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p>
    </footer>
    <script>
        function calculate() {
            try {
                const v = {};
                document.querySelectorAll('input, select').forEach(el => { v[el.id] = el.value; });
                let result = (function(v) { return (49.5/(1.0324-0.19077*Math.log10(parseFloat(v.w)-parseFloat(v.n))+0.15456*Math.log10(parseFloat(v.h)))-450).toFixed(1)+'%'; })(v);
                if (result !== undefined && !isNaN(result) && result !== 'NaN' && result !== 'NaN%') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                } else if (typeof result === 'string') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
