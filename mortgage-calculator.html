<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate monthly mortgage payment, total interest and total cost."><title>Mortgage Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/mortgage-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Mortgage Calculator</h1><p>Estimate monthly mortgage payment, total interest and total cost.</p><form id="f"><label>Loan Amount ($)</label><input type="number" id="a" required><label>Annual Rate (%)</label><input type="number" id="r" step="0.01" required><label>Term (years)</label><input type="number" id="y" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let P=+a.value,R=+r.value/100/12,N=+y.value*12,M=P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1);result.innerHTML='Monthly: $'+M.toFixed(2)+'<br>Total: $'+(M*N).toFixed(2)+'<br>Interest: $'+(M*N-P).toFixed(2);result.style.display='block'}</script></body></html>
