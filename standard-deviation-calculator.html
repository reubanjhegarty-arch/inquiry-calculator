<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate mean, variance, population & sample standard deviation."><title>Standard Deviation Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/standard-deviation-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Standard Deviation Calculator</h1><p>Calculate mean, variance, population & sample standard deviation.</p><form id="f"><label>Numbers (comma separated)</label><input type="text" id="n" placeholder="10, 20, 30, 40, 50" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let arr=n.value.split(',').map(Number).filter(x=>!isNaN(x));if(arr.length<2)return;let mean=arr.reduce((a,b)=>a+b)/arr.length;let varPop=arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/arr.length;let varSam=arr.reduce((a,b)=>a+Math.pow(b-mean,2),0)/(arr.length-1);result.innerHTML='Mean: '+mean.toFixed(2)+'<br>Population SD: '+Math.sqrt(varPop).toFixed(4)+'<br>Sample SD: '+Math.sqrt(varSam).toFixed(4);result.style.display='block'}</script></body></html>
