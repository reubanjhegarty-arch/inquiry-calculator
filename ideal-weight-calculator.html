<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Estimate your ideal healthy body weight based on height."><title>Ideal Weight Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/ideal-weight-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Ideal Weight Calculator</h1><p>Estimate your ideal healthy body weight based on height.</p><form id="f"><label>Gender</label><select id="g"><option value="m">Male</option><option value="f">Female</option></select><label>Height (inches)</label><input type="number" id="h" placeholder="e.g. 70" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let over5=+h.value-60;if(over5<0)over5=0;let kg=g.value=='m'?50+(2.3*over5):45.5+(2.3*over5);result.innerHTML='Ideal Body Weight: '+kg.toFixed(1)+' kg ('+(kg*2.20462).toFixed(1)+' lbs)';result.style.display='block'}</script></body></html>
