            <!-- Scientific Calculator -->

                <!-- Display -->
                <div id="calcDisplay" style="background: #f3f4f6; border: 2px solid #d1d5db; border-radius: 8px; padding: 20px; text-align: right; font-size: 28px; font-weight: 600; color: #1f2937; margin-bottom: 25px; font-family: 'Courier New', monospace; word-break: break-all; min-height: 45px; letter-spacing: 0.5px;">0</div>

                    <!-- Row 1: Trigonometry -->
                    <button onclick="calcFunc('sin')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">sin</button>
                    <button onclick="calcFunc('cos')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">cos</button>
                    <button onclick="calcFunc('tan')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">tan</button>
                    <button onclick="calcFunc('asin')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">asin</button>
                    <button onclick="calcFunc('acos')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">acos</button>
                    <button onclick="calcFunc('atan')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px; transition: all 0.2s;">atan</button>

                    <!-- Row 2: Logarithms & Powers -->
                    <button onclick="calcFunc('log')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">log</button>
                    <button onclick="calcFunc('ln')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">ln</button>
                    <button onclick="calcFunc('sqrt')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">√</button>
                    <button onclick="calcFunc('cbrt')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">∛</button>
                    <button onclick="calcFunc('fact')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">n!</button>
                    <button onclick="calcFunc('pow')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">x^y</button>

                    <!-- Row 3: Constants & Operations -->
                    <button onclick="calcFunc('pi')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">π</button>
                    <button onclick="calcFunc('e')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">e</button>
                    <button onclick="calcFunc('abs')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">|x|</button>
                    <button onclick="calcFunc('exp')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">e^x</button>
                    <button onclick="calcFunc('deg')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">°</button>
                    <button onclick="calcFunc('1/x')" style="padding: 12px; background: #f3f4f6; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 12px;">1/x</button>

                    <!-- Row 4: Numbers -->
                    <button onclick="calcNum('7')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">7</button>
                    <button onclick="calcNum('8')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">8</button>
                    <button onclick="calcNum('9')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">9</button>
                    <button onclick="calcOp('/')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">÷</button>
                    <button onclick="calcOp('%')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">%</button>
                    <button onclick="calcBackspace()" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; color: #6b7280; font-size: 12px;">DEL</button>

                    <!-- Row 5: Numbers -->
                    <button onclick="calcNum('4')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">4</button>
                    <button onclick="calcNum('5')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">5</button>
                    <button onclick="calcNum('6')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">6</button>
                    <button onclick="calcOp('*')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">×</button>
                    <button onclick="calcSign()" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">+/−</button>
                    <button onclick="calcParens('(')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">(</button>

                    <!-- Row 6: Numbers -->

                    <button onclick="calcNum('2')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">2</button>
                    <button onclick="calcNum('3')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">3</button>
                    <button onclick="calcOp('-')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">−</button>
                    <button onclick="calcNum('0')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; grid-column: span 2;">0</button>
                    <button onclick="calcParens(')')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">)</button>

                    <!-- Row 7: Bottom -->
                    <button onclick="calcNum('.')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">.</button>
                    <button onclick="calcOp('+')" style="padding: 12px; background: white; border: 1px solid #d1d5db; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px;">+</button>
                    <button onclick="calcEqual()" style="padding: 12px; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 14px; grid-column: span 3;">=</button>
                    <button onclick="calcClear()" style="padding: 12px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; grid-column: span 2; font-size: 13px;">Clear All</button>
                </div>
            </div>

            <!-- Search Bar -->
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search calculators... (e.g., percentage, loan, age)">
                <button onclick="searchCalculators()">Search</button>

    <!-- Embedded Scientific Calculator -->
    <section class="container" style="margin: 80px 0; padding: 0 20px;">
        <div style="max-width: 600px; margin: 0 auto;">
            <h2 style="text-align: center; margin-bottom: 40px; font-size: 32px;">Scientific Calculator</h2>
            
            <div style="background: white; border-radius: 12px; padding: 40px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 1px solid #e5e7eb;">
                
                <!-- Display -->
                <div id="calcDisplay" style="background: #f9fafb; border: 2px solid #e5e7eb; border-radius: 8px; padding: 20px; text-align: right; font-size: 32px; font-weight: 600; color: #1f2937; margin-bottom: 30px; font-family: 'Courier New', monospace; word-break: break-all; min-height: 50px;">0</div>

                <!-- Buttons -->
                <div style="display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;">
                    
                    <!-- Row 1: Functions -->
                    <button onclick="calcFunc('sin')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; transition: all 0.2s; font-size: 13px;">sin</button>
                    <button onclick="calcFunc('cos')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; transition: all 0.2s; font-size: 13px;">cos</button>
                    <button onclick="calcFunc('tan')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; transition: all 0.2s; font-size: 13px;">tan</button>
                    <button onclick="calcFunc('log')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; transition: all 0.2s; font-size: 13px;">log</button>
                    <button onclick="calcFunc('sqrt')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; transition: all 0.2s; font-size: 13px;">√</button>

                    <!-- Row 2: Numbers -->
                    <button onclick="calcNum('7')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">7</button>
                    <button onclick="calcNum('8')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">8</button>
                    <button onclick="calcNum('9')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">9</button>
                    <button onclick="calcOp('/')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">÷</button>
                    <button onclick="calcFunc('pow')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 13px;">x²</button>

                    <!-- Row 3: Numbers -->
                    <button onclick="calcNum('4')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">4</button>
                    <button onclick="calcNum('5')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">5</button>
                    <button onclick="calcNum('6')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">6</button>
                    <button onclick="calcOp('*')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">×</button>
                    <button onclick="calcFunc('pi')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #1e40af; font-size: 13px;">π</button>

                    <!-- Row 4: Numbers -->
                    <button onclick="calcNum('1')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">1</button>
                    <button onclick="calcNum('2')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">2</button>
                    <button onclick="calcNum('3')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">3</button>
                    <button onclick="calcOp('-')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">−</button>
                    <button onclick="calcBackspace()" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; color: #6b7280; font-size: 13px;">DEL</button>

                    <!-- Row 5: Bottom -->
                    <button onclick="calcNum('0')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px; grid-column: span 2;">0</button>
                    <button onclick="calcNum('.')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">.</button>
                    <button onclick="calcOp('+')" style="padding: 14px; background: white; border: 1px solid #e5e7eb; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">+</button>
                    <button onclick="calcEqual()" style="padding: 14px; background: #1e40af; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 16px;">=</button>

                    <!-- Row 6: Clear -->
                    <button onclick="calcClear()" style="padding: 14px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; grid-column: span 5; font-size: 14px;">Clear</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        let calcExpr = '';
        const calcDisplay = document.getElementById('calcDisplay');

        function calcNum(n) {
            calcExpr += n;
            calcDisplay.textContent = calcExpr || '0';
        }

        function calcOp(op) {
            if (calcExpr && !calcExpr.endsWith('+') && !calcExpr.endsWith('-') && !calcExpr.endsWith('*') && !calcExpr.endsWith('/')) {
                calcExpr += op;
                calcDisplay.textContent = calcExpr;
            }
        }

        function calcFunc(func) {
            if (func === 'sin') calcExpr += 'Math.sin(';
            else if (func === 'cos') calcExpr += 'Math.cos(';
            else if (func === 'tan') calcExpr += 'Math.tan(';
            else if (func === 'log') calcExpr += 'Math.log10(';
            else if (func === 'sqrt') calcExpr += 'Math.sqrt(';
            else if (func === 'pow') calcExpr += '**2';
            else if (func === 'pi') calcExpr += '3.14159265359';
            calcDisplay.textContent = calcExpr;
        }

        function calcEqual() {
            try {
                const result = eval(calcExpr);
                calcExpr = result.toString();
                calcDisplay.textContent = parseFloat(result.toFixed(6));
            } catch (e) {
                calcDisplay.textContent = 'Error';
                calcExpr = '';
            }
        }

        function calcBackspace() {
            calcExpr = calcExpr.slice(0, -1);
            calcDisplay.textContent = calcExpr || '0';
        }

        function calcClear() {
            calcExpr = '';
            calcDisplay.textContent = '0';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key >= '0' && e.key <= '9') calcNum(e.key);
            if (e.key === '.') calcNum('.');
            if (e.key === '+') calcOp('+');
            if (e.key === '-') calcOp('-');
            if (e.key === '*') calcOp('*');
            if (e.key === '/') { e.preventDefault(); calcOp('/'); }
            if (e.key === 'Enter') calcEqual();
            if (e.key === 'Backspace') calcBackspace();
            if (e.key === 'Escape') calcClear();
        });
    </script>
