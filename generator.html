function generateHTML(calc) {
    let formHTML = calc.inputs.map(input => {
        let field = '';
        if (input.type === 'select') {
            let opts = input.opts.split(',').map(o => `<option value="${o.trim()}">${o.trim()}</option>`).join('');
            field = `<select id="${input.id}">${opts}</select>`;
        } else {
            field = `<input type="${input.type}" id="${input.id}" placeholder="Enter ${input.label.toLowerCase()}" required>`;
        }
        return `<div class="form-group"><label>${input.label}</label>${field}</div>`;
    }).join('\n            ');

    return `<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${calc.title} — Inquiry Calculator</title>
    <meta name="description" content="${calc.desc}">
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('inquiry_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
    <\/script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Inquiry <span class="logo-badge">PRO</span></a>
            <div class="nav-links">
                <a href="/">All Calculators</a>
                <a href="/chat.html">AI Solver</a>
            </div>
        </div>
    </nav>
    <main class="wrap">
        <h1>${calc.title}</h1>
        <p>${calc.desc}</p>
        <form onsubmit="event.preventDefault(); calculate();">
            ${formHTML}
            <button type="submit">Calculate</button>
        </form>
        <div id="result" class="result" style="display:none;">
            Result: <strong id="output-val">0</strong>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Inquiry Calculator. &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p>
    </footer>
    <script>
        function calculate() {
            try {
                const v = {};
                document.querySelectorAll('input, select').forEach(el => { v[el.id] = el.value; });
                let result = (function(v) { ${calc.logic} })(v);
                if (result !== undefined && !isNaN(result) && result !== 'NaN' && result !== 'NaN%') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                } else if (typeof result === 'string') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }
    <\/script>
</body>
</html>`;
}

// --- ZIP GENERATION ---
function generateZip() {
    document.getElementById('status').innerText = "Generating 100 files... please wait.";
    const zip = new JSZip();
    
    calcs.forEach(calc => {
        zip.file(calc.slug + '.html', generateHTML(calc));
    });

    zip.generateAsync({type:"blob"}).then(function(content) {
        saveAs(content, "inquiry-calculators-100.zip");
        document.getElementById('status').innerText = "Done! 100 calculators downloaded as ZIP.";
    });
}
</script>
</body>
</html>
