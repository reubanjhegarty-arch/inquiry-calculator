<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Calculate monthly loan payments, principal and interest schedule."><title>Amortization Calculator - Inquiry Calculator</title><link rel="icon" type="image/png" href="/favicon-96x96.png?v=2" sizes="96x96"/><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"/><link rel="shortcut icon" href="/favicon.ico?v=2"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2"/><link rel="canonical" href="https://inquirycalculator.com/amortization-calculator.html"><link rel="stylesheet" href="style.css"></head><body><nav><div class="wrap nav"><a class="brand" href="index.html">Inquiry<span>Calculator</span></a><div class="nav-links"><a href="index.html">Home</a><a href="calculators.html">All Calculators</a><a href="about.html">About</a><a href="contact.html">Contact</a></div></div></nav><main class="wrap"><h1>Amortization Calculator</h1><p>Calculate monthly loan payments, principal and interest schedule.</p><form id="f"><label>Loan Amount ($)</label><input type="number" id="p" required><label>Interest Rate (%)</label><input type="number" id="r" step="0.01" required><label>Term (Years)</label><input type="number" id="t" required><button type="submit">Calculate</button></form><div id="result" class="result"></div></main><footer><div class="wrap foot"><div>&copy; 2025 InquiryCalculator</div><div class="foot-links"><a href="about.html">About</a><a href="contact.html">Contact</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a></div></div></footer><script>f.onsubmit=e=>{e.preventDefault();let rate=+r.value/100/12,months=+t.value*12,pmt=+p.value*rate*Math.pow(1+rate,months)/(Math.pow(1+rate,months)-1);result.innerHTML='Monthly Payment: $'+pmt.toFixed(2)+'<br>Total Interest: $'+(pmt*months-+p.value).toFixed(2);result.style.display='block'}</script></body></html>
