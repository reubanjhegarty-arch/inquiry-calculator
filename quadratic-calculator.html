<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quadratic Calculator — Inquiry Calculator</title>
    <meta name="description" content="Solve ax² + bx + c = 0.">
    <link rel="stylesheet" href="style.css">
    <script>
        const savedTheme = localStorage.getItem('inquiry_theme');
        if (savedTheme) { document.documentElement.setAttribute('data-theme', savedTheme); }
        else { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Inquiry <span class="logo-badge">PRO</span></a>
            <div class="nav-links">
                <a href="/">All Calculators</a>
                <a href="/chat.html">AI Solver</a>
            </div>
        </div>
    </nav>
    <main class="wrap">
        <h1>Quadratic Calculator</h1>
        <p>Solve ax² + bx + c = 0.</p>
        <form onsubmit="event.preventDefault(); calculate();">
            <div class="form-group"><label>a</label><input type="number" id="a" placeholder="Enter a" required></div>
            <div class="form-group"><label>b</label><input type="number" id="b" placeholder="Enter b" required></div>
            <div class="form-group"><label>c</label><input type="number" id="c" placeholder="Enter c" required></div>
            <button type="submit">Calculate</button>
        </form>
        <div id="result" class="result" style="display:none;">
            Result: <strong id="output-val">0</strong>
        </div>
    </main>
    <footer>
        <p>&copy; 2025 Inquiry Calculator. &middot; <a href="/privacy.html">Privacy</a> &middot; <a href="/terms.html">Terms</a></p>
    </footer>
    <script>
        function calculate() {
            try {
                const v = {};
                document.querySelectorAll('input, select').forEach(el => { v[el.id] = el.value; });
                let result = (function(v) { let a=parseFloat(v.a), b=parseFloat(v.b), c=parseFloat(v.c); let d=b*b-4*a*c; if(d<0) return 'No real roots'; return 'x1: '+((-b+Math.sqrt(d))/(2*a)).toFixed(2)+', x2: '+((-b-Math.sqrt(d))/(2*a)).toFixed(2); })(v);
                if (result !== undefined && !isNaN(result) && result !== 'NaN' && result !== 'NaN%') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                } else if (typeof result === 'string') {
                    document.getElementById('output-val').innerHTML = result;
                    document.getElementById('result').style.display = 'block';
                }
            } catch(e) { console.error(e); }
        }
    </script>
</body>
</html>
